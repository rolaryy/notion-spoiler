<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Steam Spoiler</title>


<style>

/* ============================================================
   基础设置
   ============================================================ */

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;

    background: transparent;
}


body {

    margin: 0;

    /*
     * 字体优先使用系统字体，
     * 中文、日文、英文都可以正常显示。
     */

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        "PingFang SC",
        "Hiragino Sans",
        "Yu Gothic",
        Arial,
        sans-serif;


    /*
     * 默认字号
     */

    font-size: 16px;


    /*
     * 行高
     */

    line-height: 1.6;


    /*
     * 普通文字：
     * 纯黑色
     */

    color: #000000;


    /*
     * 长文字自动换行
     */

    overflow-wrap: anywhere;

    word-break: break-word;

}


/* ============================================================
   主文字区域
   ============================================================ */

#content {

    /*
     * 占满 Embed 的可用宽度
     */

    width: 100%;


    /*
     * 非常重要：
     *
     * 保留 \n 转换出来的换行。
     */

    white-space: pre-wrap;


    /*
     * 长文本自动换行
     */

    overflow-wrap: anywhere;

    word-break: break-word;

}


/* ============================================================
   Steam 风格黑条
   ============================================================ */

.spoiler {

    /*
     * 必须使用 inline。
     *
     * 这样黑条可以直接嵌在正常文字中：
     *
     * 这是正常文字 [黑条] 这是正常文字
     */

    display: inline;


    /*
     * 黑色背景
     */

    background-color: #181a1d;


    /*
     * 隐藏文字。
     *
     * 文字颜色和背景颜色一致，
     * 因此视觉上只看到黑条。
     */

    color: #181a1d;


    /*
     * Steam 风格轻微圆角
     */

    border-radius: 2px;


    /*
     * 黑条左右稍微留一点空间。
     *
     * 这样黑条不会紧贴正常文字。
     */

    padding-left: 0.15em;

    padding-right: 0.15em;


    /*
     * 鼠标指针
     */

    cursor: pointer;


    /*
     * 未展开时不允许直接选择隐藏文字
     */

    user-select: none;


    /*
     * 黑条颜色变化动画
     */

    transition:
        background-color 0.12s ease,
        color 0.12s ease;


    /*
     * 长剧透可以自然换行
     */

    overflow-wrap: anywhere;

    word-break: break-word;


    /*
     * 如果剧透内容跨行，
     * 每一行的黑色背景都能保持完整。
     */

    -webkit-box-decoration-break: clone;

    box-decoration-break: clone;

}


/* ============================================================
   鼠标悬停在未展开黑条上
   ============================================================ */

.spoiler:hover {

    background-color: #292c30;

}


/* ============================================================
   已展开的剧透
   ============================================================ */

.spoiler.revealed {

    /*
     * 去除黑色背景
     */

    background-color: transparent;


    /*
     * 恢复正常文字颜色。
     *
     * inherit 会继承 body 的 #000000。
     */

    color: inherit;


    /*
     * 展开后可以选择文字
     */

    user-select: text;

}


/* ============================================================
   已展开剧透的鼠标悬停效果
   ============================================================ */

.spoiler.revealed:hover {

    background-color: rgba(0, 0, 0, 0.05);

}


/* ============================================================
   空白剧透
   ============================================================ */

.spoiler.empty {

    /*
     * 如果写：
     *
     * [spoiler][/spoiler]
     *
     * 至少保留一点可点击区域。
     */

    min-width: 1em;

}

</style>

</head>


<body>


<!-- ==========================================================
     主内容区域
     ========================================================== -->

<div id="content"></div>


<script>

(function () {


    /* ========================================================
       1. 获取 URL 参数
       ======================================================== */


    const params =
        new URLSearchParams(
            window.location.search
        );


    /*
     * 获取 text 参数
     *
     * 例如：
     *
     * ?text=这是正常文字[spoiler]这是剧透[/spoiler]
     */

    const originalText =
        params.get("text") || "";


    /*
     * 主容器
     */

    const content =
        document.getElementById("content");


    /* ========================================================
       2. 处理 URL 中的换行
       ======================================================== */


    /*
     * URL 不能很方便地直接保存真实换行，
     * 所以我们规定：
     *
     * \n
     *
     * 表示换行。
     *
     *
     * 例如：
     *
     * 第一行\n第二行
     *
     * 会变成：
     *
     * 第一行
     * 第二行
     *
     *
     * 同时也兼容真正的换行符。
     */


    const text =
        originalText.replace(
            /\\n/g,
            "\n"
        );


    /* ========================================================
       3. 创建普通文字
       ======================================================== */


    function createNormalText(text) {

        /*
         * 使用 TextNode。
         *
         * 不使用 innerHTML。
         *
         * 因此：
         *
         * <script>
         * <img>
         * <div>
         *
         * 都只会被当成普通文字。
         */

        return document.createTextNode(text);

    }


    /* ========================================================
       4. 创建剧透黑条
       ======================================================== */


    function createSpoiler(text) {


        /*
         * 创建 span。
         */

        const spoiler =
            document.createElement("span");


        /*
         * 添加黑条 class。
         */

        spoiler.className =
            "spoiler";


        /*
         * 使用 textContent。
         *
         * 这非常重要。
         *
         * 剧透内容不会被当成 HTML。
         */

        spoiler.textContent =
            text;


        /* ----------------------------------------------------
           空白剧透
           ---------------------------------------------------- */


        if (text.length === 0) {

            spoiler.classList.add(
                "empty"
            );


            /*
             * 创建一个不可见空格，
             * 保证仍然有可点击区域。
             */

            spoiler.innerHTML =
                "&nbsp;";

        }


        /* ----------------------------------------------------
           点击黑条
           ---------------------------------------------------- */


        spoiler.addEventListener(
            "click",
            function () {

                /*
                 * 只切换当前这个黑条。
                 *
                 * 其他黑条完全不会受到影响。
                 */

                this.classList.toggle(
                    "revealed"
                );

            }
        );


        return spoiler;

    }


    /* ========================================================
       5. 解析混合文本
       ======================================================== */


    function parseText(text) {


        /*
         * 创建 DocumentFragment。
         *
         * 最后一次性放入页面，
         * 比不断修改 innerHTML 更安全。
         */

        const fragment =
            document.createDocumentFragment();


        /*
         * ----------------------------------------------------
         * [spoiler]……[/spoiler]
         * ----------------------------------------------------
         *
         * 例如：
         *
         * 这是正常文字。
         *
         * [spoiler]这是剧透[/spoiler]
         *
         * 这是正常文字。
         *
         *
         * [\s\S]
         *
         * 可以匹配包括换行在内的所有字符。
         *
         *
         * *?
         *
         * 使用非贪婪模式，
         * 让多个剧透可以分别识别。
         */


        const regex =
            /\[spoiler\]([\s\S]*?)\[\/spoiler\]/gi;


        /*
         * 当前已经解析到的位置
         */

        let lastIndex = 0;


        /*
         * 当前匹配结果
         */

        let match;


        /* ====================================================
           6. 逐个寻找所有黑条
           ==================================================== */


        while (
            (match = regex.exec(text)) !== null
        ) {


            /* ------------------------------------------------
               6.1 黑条之前的普通文字
               ------------------------------------------------ */


            if (
                match.index > lastIndex
            ) {


                const normalText =
                    text.substring(
                        lastIndex,
                        match.index
                    );


                fragment.appendChild(
                    createNormalText(
                        normalText
                    )
                );

            }


            /* ------------------------------------------------
               6.2 当前黑条
               ------------------------------------------------ */


            const spoilerText =
                match[1];


            fragment.appendChild(
                createSpoiler(
                    spoilerText
                )
            );


            /* ------------------------------------------------
               6.3 更新解析位置
               ------------------------------------------------ */


            lastIndex =
                regex.lastIndex;

        }


        /* ====================================================
           7. 添加最后剩余的普通文字
           ==================================================== */


        if (
            lastIndex < text.length
        ) {


            const remainingText =
                text.substring(
                    lastIndex
                );


            fragment.appendChild(
                createNormalText(
                    remainingText
                )
            );

        }


        return fragment;

    }


    /* ========================================================
       8. 如果没有 text 参数
       ======================================================== */


    if (!originalText) {


        content.textContent =
            "请在 URL 中提供 text 参数";


        return;

    }


    /* ========================================================
       9. 开始渲染
       ======================================================== */


    content.appendChild(
        parseText(text)
    );


})();

</script>


</body>

</html>
